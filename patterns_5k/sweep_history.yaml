# Sweep 1: CNN varying history length, all else fixed
sweep_name: "cnn_history_sweep"
strategy: "grid"
metric: "test_corr"
direction: "maximize"
seed: 42

base_config:
  datadir: "data/oracle_ICMS_150/"
  problematic_neurons: [19, 104, 201, 211, 300, 310, 311, 312]
  inference_mode: false
  artifact_path: null
  seed: 42
  split_mode: "oracle"
  input_bin_size_ms: 10
  output_bin_size_ms: 10
  n_input_bins: 60
  n_output_bins: 60
  output_offset: 0
  max_time_ms: 600
  encoding_mode: "current"
  batch_size: 16
  model_type: "cnn"
  embedding_dim: 0
  dropout: 0.2
  conv_channels: [128]
  kernel_sizes: [60]
  fc_dims: [256]
  pooling: "max"
  init_bias: null
  init_state: false
  n_initial_state_bins: 1
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0
  weight_loss: 1
  sum_loss: false
  patience: 10
  criterion_fn: "poisson"
  pattern_limit: 50

search_space:
  history:
    type: categorical
    values: [1, 2, 3, 5, 10, 20, 30, 50]
