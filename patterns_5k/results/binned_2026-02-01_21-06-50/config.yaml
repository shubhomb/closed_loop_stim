# =====================
# Experiment Configuration
# =====================

# Paths
datadir: "data/oracle_ICMS_150/"

# Experiment settings
inference_mode: false
artifact_path: null  # Set to a timestamped folder path for inference mode
seed: 42

# Data split settings
split_mode: "oracle"  # 'oracle' or 'random'

# Dataset configuration
bin_size_ms: 10        # Temporal resolution (e.g., 10ms, 20ms)
n_input_bins: 1        # How many consecutive stim bins to use as input
n_output_bins: 6       # How many consecutive spike bins to predict
output_offset: 0       # Offset from input start to output start (0 = same window)
max_time_ms: 600       # Maximum time to consider after trial start

# DataLoader settings
batch_size: 128

# Problematic neurons to drop (high firing rates, multi-unit activity, artifacts)
problematic_neurons: [19, 104, 201, 211, 300, 310, 311, 312]

# =====================
# Model Configuration
# =====================
model_type: "cnn"      # 'mlp' or 'cnn'

# Shared model settings
embedding_dim: 32
dropout: 0.2

# MLP-specific settings
hidden_dims: [128, 64]

# CNN-specific settings
conv_channels: [64, 128]
kernel_sizes: [10, 1]
fc_dims: [128]

# Model initialization
init_bias: 0.0
linear: false           # MLP only

# =====================
# Training Configuration
# =====================
num_epochs: 50
learning_rate: 0.001
weight_decay: 0
weight_loss: 1        # Weight for non-zero samples in loss
patience: 10           # Early stopping patience

# Loss function
criterion_fn: "poisson"  # 'poisson' or 'bce'

# =====================
# Visualization settings
# =====================
pattern_limit: 3       # Number of patterns to visualize in oracle trials plot
