sweep_name: "base_cnn_kernel_sweep"
strategy: "grid"
metric: "test_corr"
direction: "maximize"
seed: 42

base_config:
  datadir: "data/oracle_ICMS_150/"
  problematic_neurons: [19, 104, 201, 211, 300, 310, 311, 312]
  inference_mode: false
  artifact_path: null
  seed: 42
  split_mode: "oracle"
  input_bin_size_ms: 10
  output_bin_size_ms: 10
  n_input_bins: 60
  n_output_bins: 60
  output_offset: 0
  max_time_ms: 600
  encoding_mode: "current"
  history: 0
  batch_size: 16
  model_type: "cnn"
  embedding_dim: 0
  dropout: 0.2
  conv_channels: [128]
  fc_dims: [256]
  pooling: "none"
  init_bias: null
  init_state: false
  num_epochs: 50
  weight_loss: 1
  sum_loss: false
  patience: 10
  criterion_fn: "poisson"
  pattern_limit: 50

search_space:
  kernel_sizes:
    type: categorical
    values:
      - [1]
      - [3]
      - [5]
      - [10]
      - [20]
      - [30]
      - [60]
  learning_rate:
    type: log_uniform
    low: 0.0001
    high: 0.01
    values: [0.0001, 0.0005, 0.001, 0.005, 0.01]
  fc_dims:
    type: categorical
    values:
      - [128]
      - [256]
      - [256, 128]
  weight_decay:
    type: log_uniform
    low: 0.00001
    high: 0.01
    values: [0, 0.00001, 0.0001, 0.001, 0.01]