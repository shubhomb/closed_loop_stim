# =====================================================================
# SLURM Sweep: Cache CNN (HistoryCacheCausalCNN)
# =====================================================================
#
# Tests learning rate, weight decay, number of layers, kernel sizes,
# cache sizes, and cache embedding dimensions.
#
# The cache model feeds its own recent predicted firing rates back as
# additional input channels.  history and init_state are forced to
# 0 / False internally by run_experiment.
#
# Designed for multi-seed runs on NOTS via slurm_sweep.py:
#   python slurm_sweep.py --sweep-config slurm_sweep_cache_cnn.yaml \
#       --seeds 5 --slurm-template nots_gpu.slurm
# =====================================================================

sweep_name: "slurm_cache_cnn"
strategy: "grid"
metric: "all_test_corr"
direction: "maximize"
seed: 42

base_config:
  datadir: "data/oracle_ICMS_150/"
  problematic_neurons: [19, 104, 201, 211, 300, 310, 311, 312]
  inference_mode: false
  artifact_path: null
  seed: 42
  split_mode: "oracle"
  input_bin_size_ms: 10
  output_bin_size_ms: 10
  n_input_bins: 60
  n_output_bins: 60
  output_offset: 0
  max_time_ms: 600
  encoding_mode: "current"
  history: 0
  init_state: false
  batch_size: 16
  model_type: "cache_cnn"
  embedding_dim: 0
  dropout: 0.2
  pooling: "none"
  init_bias: null
  num_epochs: 50
  weight_loss: 1
  sum_loss: false
  patience: 10
  criterion_fn: "poisson"
  pattern_limit: 50
  skip_oracle_plots: true
  cache_train_mode: "teacher_forcing"
  use_batch_norm: true

search_space:
  # ---- Learning rate ----
  learning_rate:
    type: categorical
    values: [0.0001, 0.0005, 0.001, 0.005]

  # ---- Weight regularization ----
  weight_decay:
    type: categorical
    values: [0, 0.00001, 0.0001, 0.001]

  # ---- Cache size (number of recent output bins stored per neuron) ----
  cache_size:
    type: categorical
    values: [2, 5, 10, 20]

  # ---- Cache embedding dim ----
  cache_embed_dim:
    type: categorical
    values: [8, 32]

  # ---- Architecture bundles ----
  _arch:
    type: categorical
    values:
      # --- 1-layer architectures ---
      - { kernel_sizes: [3],  conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [5],  conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [10], conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [30], conv_channels: [256], fc_dims: [256] }
      # --- 2-layer architectures ---
      - { kernel_sizes: [10, 3], conv_channels: [256, 128], fc_dims: [256] }
      - { kernel_sizes: [5, 3],  conv_channels: [256, 128], fc_dims: [256] }
      # --- 3-layer architectures ---
      - { kernel_sizes: [10, 5, 3], conv_channels: [256, 128, 64], fc_dims: [256] }
