# =====================================================================
# SLURM Sweep: Quick test (2 configs × 1 seed = 2 trials)
# =====================================================================
# Verify the full pipeline works before launching real sweeps.
#
#   python slurm/slurm_sweep.py --sweep-config slurm/slurm_sweep_test.yaml \
#       --seeds 1 --slurm-template slurm/nots_cpu.slurm --tasks-per-job 2
# =====================================================================

sweep_name: "slurm_test"
strategy: "grid"
metric: "all_test_correlation"
direction: "maximize"
seed: 42
k_cross: 3

base_config:
  datadir: "/scratch/sb272/patterns5k_data/oracle_ICMS_150/"
  problematic_neurons: [19, 104, 201, 211, 300, 310, 311, 312]
  inference_mode: false
  artifact_path: null
  seed: 42
  split_mode: "oracle"
  input_bin_size_ms: 10
  output_bin_size_ms: 10
  n_input_bins: 60
  n_output_bins: 60
  output_offset: 0
  max_time_ms: 600
  encoding_mode: "current"
  history: 0
  batch_size: 16
  model_type: "cnn"
  embedding_dim: 0
  dropout: 0.2
  pooling: "none"
  init_bias: null
  init_state: true
  num_epochs: 3
  weight_loss: 1
  sum_loss: false
  patience: 2
  criterion_fn: "poisson"
  pattern_limit: 50
  skip_oracle_plots: true

search_space:
  learning_rate:
    type: categorical
    values: [0.001, 0.005]

  _arch:
    type: categorical
    values:
      - { kernel_sizes: [5], conv_channels: [128], fc_dims: [256] }
