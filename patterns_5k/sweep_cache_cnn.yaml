# =====================================================================
# Hyperparameter Sweep: HistoryCacheCausalCNN
# =====================================================================
#
# Sweeps cache_size, cache_embed_dim, kernel_sizes (single & multi-layer),
# and conv_channels.
#
# Usage:
#   python run_sweep.py --sweep-config sweep_cache_cnn.yaml
#   python run_sweep.py --sweep-config sweep_cache_cnn.yaml --dry-run
# =====================================================================

sweep_name: "cache_cnn_sweep"
strategy: "grid"
metric: "test_corr"
direction: "maximize"
seed: 42

base_config:
  datadir: "data/oracle_ICMS_150/"
  problematic_neurons: [19, 104, 201, 211, 300, 310, 311, 312]
  inference_mode: false
  artifact_path: null
  seed: 42
  split_mode: "oracle"
  input_bin_size_ms: 10
  output_bin_size_ms: 10
  n_input_bins: 60
  n_output_bins: 60
  output_offset: 0
  max_time_ms: 600
  encoding_mode: "current"
  # cache_cnn forces history=0 and init_state=False internally,
  # but we set them here for clarity.
  history: 0
  init_state: false
  batch_size: 16
  model_type: "cache_cnn"
  embedding_dim: 0
  dropout: 0.2
  pooling: "none"
  init_bias: null
  learning_rate: 0.001
  num_epochs: 50
  weight_loss: 1
  sum_loss: false
  patience: 10
  criterion_fn: "poisson"
  pattern_limit: 50
  skip_oracle_plots: true
  cache_train_mode: "teacher_forcing"
  use_batch_norm: true
  weight_decay: 0.00001

search_space:
  # ---- Architecture bundles (kernel_sizes + conv_channels must match length) ----
  _arch:
    type: categorical
    values:
      # --- 1-layer architectures ---
      - { kernel_sizes: [3],  conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [5],  conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [10], conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [15], conv_channels: [256], fc_dims: [256] }
      - { kernel_sizes: [30], conv_channels: [256], fc_dims: [256] }
      # --- 2-layer architectures ---
      - { kernel_sizes: [10, 3], conv_channels: [256, 128], fc_dims: [256] }
      - { kernel_sizes: [10, 5], conv_channels: [256, 128], fc_dims: [256] }
      - { kernel_sizes: [5, 3],  conv_channels: [256, 128], fc_dims: [256] }
      - { kernel_sizes: [5, 5],  conv_channels: [256, 128], fc_dims: [256] }

  # ---- Cache size (number of recent output bins stored per neuron) ----
  cache_size:
    type: categorical
    values: [2, 3, 5, 10, 20]

  # ---- Cache embedding dim (per-neuron cache → embedding) ----
  cache_embed_dim:
    type: categorical
    values: [8, 32, 64]
