# =====================================================================
# Local architecture sweep — FULL PASS.
#
# Expanded from local_sweep_arch_timing.yaml after the 440-trial timing
# pass confirmed ~6-8s/trial. Adds:
#   - more monotonic kernel-size combos (2, 3, 4-layer)
#   - fc_dims swept independently across all archs
#   - 3 lr values (3e-4, 1e-3, 3e-3)
#   - 3 wd values (0, 1e-5, 1e-4)
#
# 14 archs x 3 fc x 3 lr x 3 wd = 378 configs x 10 seeds = 3,780 trials.
# At ~7s/trial on 2 GPUs ~= 4 hours wall time.
# =====================================================================

sweep_name: "local_arch_full"
strategy: "grid"
metric: "test_corr"
direction: "maximize"
seed: 42

base_config:
  datadir: "data/"
  sample_rate: 30000
  stim_ms: 600
  bin_ms: 10
  n_vis_trials: 100
  max_time_ms: 660
  input_bin_ms: 10
  output_bin_ms: 10
  encoding_mode: "current"
  val_frac: 0.2
  batch_size: 512
  num_workers: 4
  n_epochs: 50
  patience: 3
  use_batch_norm: true
  vis_orient_time: 600
  budget_per_step: 4
  encodings: [-1, 0, 1, 2]
  require_improvement: true
  k_trials_per_pattern: 10
  shuffle_seed: 0
  dropout: 0.3

search_space:
  _arch:
    type: categorical
    values:
      # ---- 2-layer convs ----
      - { kernel_sizes: [10, 7], conv_channels: [256, 256] }
      - { kernel_sizes: [10, 5], conv_channels: [256, 256] }
      - { kernel_sizes: [7, 5],  conv_channels: [256, 256] }
      - { kernel_sizes: [7, 3],  conv_channels: [256, 256] }
      - { kernel_sizes: [5, 3],  conv_channels: [256, 256] }
      - { kernel_sizes: [3, 3], conv_channels: [256, 256] }

      # ---- 3-layer convs ----
      - { kernel_sizes: [10, 7, 5], conv_channels: [256, 256, 256] }
      - { kernel_sizes: [10, 5, 3], conv_channels: [256, 256, 256] }
      - { kernel_sizes: [7, 7, 5],  conv_channels: [256, 256, 256] }
      - { kernel_sizes: [7, 5, 3],  conv_channels: [256, 256, 256] }
      - { kernel_sizes: [5, 5, 3],  conv_channels: [256, 256, 256] }
      - { kernel_sizes: [3, 3, 3],  conv_channels: [256, 256, 256] }

      - { kernel_sizes: [10, 7], conv_channels: [512, 512] }
      - { kernel_sizes: [7, 5],  conv_channels: [512, 512] }
      - { kernel_sizes: [5, 3],  conv_channels: [512, 512] }
      - { kernel_sizes: [3, 3], conv_channels: [512, 512] }

      # ---- 3-layer convs ----
      - { kernel_sizes: [10, 7, 5], conv_channels: [512, 512, 512] }
      - { kernel_sizes: [7, 7, 5],  conv_channels: [512, 512, 512] }
      - { kernel_sizes: [5, 5, 3],  conv_channels: [512, 512, 512] }
      - { kernel_sizes: [3, 3, 3],  conv_channels: [512, 512, 512] }


  fc_dims:
    type: categorical
    values:
      - [512]
      - [512, 256]

  lr:
    type: categorical
    values: [3.0e-4, 1.0e-3, 3.0e-3]

  weight_decay:
    type: categorical
    values: [0, 1.0e-5, 1.0e-4]
