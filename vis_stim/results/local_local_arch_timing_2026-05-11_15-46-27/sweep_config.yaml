# =====================================================================
# Local architecture sweep — TIMING PASS.
#
# Same 12 architectures we plan to run for real, but n_epochs=3 instead
# of 50, so we can measure per-trial cost on this workstation and
# extrapolate to a full run before committing GPU hours.
#
# 12 archs x 1 lr x 1 wd x 3 seeds = 36 trials.
#
# To convert this into the real run, change n_epochs back to 50.
# Pass --seeds 3 to local_sweep.py (or rely on its default).
# =====================================================================

sweep_name: "local_arch_timing"
strategy: "grid"
metric: "test_corr"
direction: "maximize"
seed: 42

base_config:
  datadir: "data/"
  sample_rate: 30000
  stim_ms: 600
  bin_ms: 10
  n_vis_trials: 100
  max_time_ms: 660
  input_bin_ms: 10
  output_bin_ms: 10
  encoding_mode: "current"
  val_frac: 0.2
  batch_size: 512
  num_workers: 4
  n_epochs: 50        
  patience: 3
  use_batch_norm: true
  vis_orient_time: 600
  budget_per_step: 4
  encodings: [-1, 0, 1, 2]
  require_improvement: true
  k_trials_per_pattern: 10
  shuffle_seed: 0
  dropout: 0.3

search_space:
  _arch:
    type: categorical
    values:
      # ---- 2-layer convs, 1 FC layer ----
      - { kernel_sizes: [10, 7], conv_channels: [256, 256], fc_dims: [512] }
      - { kernel_sizes: [10, 5], conv_channels: [256, 256], fc_dims: [512] }
      - { kernel_sizes: [7, 5],  conv_channels: [256, 256], fc_dims: [512] }
      - { kernel_sizes: [7, 3],  conv_channels: [256, 256], fc_dims: [512] }
      - { kernel_sizes: [5, 3],  conv_channels: [256, 256], fc_dims: [512] }
      - { kernel_sizes: [10, 3], conv_channels: [256, 256], fc_dims: [512] }

      # ---- 3-layer convs ----
      - { kernel_sizes: [10, 7, 5],   conv_channels: [256, 256, 256], fc_dims: [512] }
      - { kernel_sizes: [10, 5, 3],   conv_channels: [256, 256, 256], fc_dims: [512, 256] }
      - { kernel_sizes: [7, 7, 5],    conv_channels: [256, 256, 256], fc_dims: [512] }
      - { kernel_sizes: [7, 5, 3],    conv_channels: [256, 256, 256], fc_dims: [512, 256] }
      - { kernel_sizes: [5, 5, 3],    conv_channels: [256, 256, 256], fc_dims: [512] }
  lr:
    type: float_uniform
    low: 1.0e-4
    high: 1.0e-3
    n_grid_points: 2      # -> [1e-4, 1e-3, 1e-2]

  weight_decay:
    type: float_uniform
    low: 0
    high: 1.0e-4
    n_grid_points: 2
